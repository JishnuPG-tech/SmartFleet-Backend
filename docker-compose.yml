version: "3.8"

services:
  api:
    build: .
    container_name: smartfleet-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/smartfleet
      - JWT_SECRET=smartfleet-super-secure-production-key-2026
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pod_uploads:/app/app/uploads/pod

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: smartfleet-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smartfleet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pod_uploads:
